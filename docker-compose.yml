services:
  yakuman-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: yakuman-backend:latest
    restart: unless-stopped
    init: true
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      NODE_ENV: production
      API_PORT: "11000"
      APP_ORIGIN: "${APP_ORIGIN:?Set APP_ORIGIN to your frontend HTTPS origin}"
      COOKIE_SECURE: "true"
      DATABASE_PATH: /app/data/yakuman.sqlite
    volumes:
      - ./data:/app/data
    expose:
      - "11000"
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const r = await fetch('http://127.0.0.1:11000/api/health'); if (!r.ok || !(await r.json()).ok) process.exit(1);"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.docker.network: elysia-network
      traefik.http.routers.yakuman-backend.rule: "Host(`yakuman.elysiavernight.com`)"
      traefik.http.routers.yakuman-backend.entrypoints: websecure
      traefik.http.routers.yakuman-backend.tls.certresolver: myresolver
      traefik.http.routers.yakuman-backend.service: yakuman-backend
      traefik.http.services.yakuman-backend.loadbalancer.server.port: "11000"
    networks:
      - elysia-network

networks:
  elysia-network:
    external: true
